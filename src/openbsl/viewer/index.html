<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openbsl</title>
<style>
  :root { --bg:#fafafa; --fg:#222; --muted:#777; --line:#ddd; --accent:#1f6fd1; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header, .bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); background:#fff; }
  button, select, input { font:inherit; padding:3px 8px; border:1px solid #bbb; border-radius:4px; background:#fff; }
  button:hover { background:#eef4ff; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #meas div { border:1px solid var(--line); border-radius:4px; padding:2px 8px; background:#fff; }
  #meas b { font-variant-numeric: tabular-nums; }
  #plot { display:block; width:100%; height:55vh; cursor:text; background:#fff; }
  .hint { color:var(--muted); font-size:12px; }
  .tag { background:#eef4ff; color:var(--accent); border-radius:4px; padding:1px 6px; font-weight:600; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:10px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  table { border-collapse:collapse; width:100%; margin-bottom:12px; background:#fff; }
  th, td { border:1px solid var(--line); padding:2px 6px; text-align:right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align:left; }
  th { background:#f2f2f2; }
  tr[data-id] { cursor:pointer; }
  h3 { margin:8px 0 4px; font-size:13px; }
  .scroll { max-height:45vh; overflow:auto; }
  td.x { color:#c00; text-align:center; }
</style>
</head>
<body>
<header>
  <b>openbsl</b>
  <select id="rec"></select>
  <span class="tag" id="lessonName"></span>
  <span id="segs"></span>
  <span>|</span>
  <button data-win="1.2">1 cycle</button>
  <button data-win="3.5">3 cycles</button>
  <button data-win="10">10 s</button>
  <button data-win="all">All</button>
  <span class="hint">Drag = select · wheel/pinch = zoom · shift+wheel, trackpad swipe or ←/→ = pan · Enter = save · Esc = clear</span>
</header>
<div class="bar" id="meas"></div>
<canvas id="plot"></canvas>
<div class="bar">
  Label selection as
  <select id="cond"></select>
  <select id="comp"></select>
  cycle <select id="cyc"><option>1</option><option>2</option><option>3</option></select>
  <button class="primary" id="save">Save (Enter)</button>
  <span class="hint" id="tip"></span>
</div>
<main>
  <section>
    <h3>Annotations (<span id="nAnn">0</span>) — click a row to jump to it
      <button id="csvAnn">Export all CSV</button> <button id="clear">Clear this recording</button></h3>
    <div class="scroll"><table id="annTbl"></table></div>
  </section>
  <section>
    <h3>Data Report <button id="csvRep">Export CSV</button></h3>
    <div id="params"></div>
    <div id="report"></div>
  </section>
</main>
<script src="data.js"></script>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
