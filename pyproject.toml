[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbsl"
version = "0.1.0"
description = "Open Biopac Student Lab recordings without the proprietary software: CSV export and a browser-based measurement/annotation viewer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Keerthik Muruganandam" }]
dependencies = ["bioread>=3", "numpy", "pandas", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
openbsl = "openbsl.cli:main"

[tool.setuptools.package-data]
openbsl = ["viewer/*.html", "viewer/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
